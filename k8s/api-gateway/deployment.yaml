apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: jacoboossag/api-gateway:dev
          ports:
            - containerPort: 8080
          env:
            # Perfil
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"

            # Zipkin
            - name: SPRING_ZIPKIN_BASE_URL
              value: "http://zipkin-service:9411"

            # Config Server
            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://cloud-config:9296"

            # Eureka server URL
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://service-discovery:8761/eureka/"

            # Register Pod IP in Eureka
            - name: EUREKA_INSTANCE_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"

            # Nombre del servicio en Eureka
            - name: SPRING_APPLICATION_NAME
              value: "API-GATEWAY"

            # Puerto interno
            - name: SERVER_PORT
              value: "8080"

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: common-config-volume
              mountPath: /app/config

      volumes:
        - name: common-config-volume
          configMap:
            name: common-config