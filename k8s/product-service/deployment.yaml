apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: microservices
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: jacoboossag/product-service:dev
          ports:
            - containerPort: 8500
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "dev"

            - name: SPRING_ZIPKIN_BASE_URL
              value: "http://zipkin-service:9411"

            - name: SPRING_CONFIG_IMPORT
              value: "optional:configserver:http://cloud-config:9296"

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://service-discovery:8761/eureka/"

            # ✅ Eureka registra instancia con IP real del Pod
            - name: EUREKA_INSTANCE_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            # ✅ Asegura registro basado en IP, no hostname
            - name: EUREKA_INSTANCE_PREFER_IP_ADDRESS
              value: "true"

            - name: SPRING_APPLICATION_NAME
              value: "PRODUCT-SERVICE"

            - name: SERVER_PORT
              value: "8500"

            - name: SERVER_SERVLET_CONTEXT_PATH
              value: "/product-service"

          livenessProbe:
            httpGet:
              path: /product-service/actuator/health
              port: 8500
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /product-service/actuator/health
              port: 8500
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: common-config-volume
              mountPath: /app/config
      volumes:
        - name: common-config-volume
          configMap:
            name: common-config